<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoicePod 音声テスト</title>
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 40px 20px; }
    .btn {
      display: inline-block;
      font-size: 20px;
      padding: 16px 32px;
      margin: 15px;
      border-radius: 10px;
      background-color: #0284c7;
      color: white;
      text-decoration: none;
      cursor: pointer;
    }
    input[type="file"] { display: none; }
    #audioPlayer { margin-top: 20px; width: 80%; max-width: 400px; }
    #status { margin-top: 20px; font-size: 16px; color: #444; }
  </style>
</head>
<body>
  <h2>VoicePod 音声テスト (iOS 12対応)</h2>
  
  <label class="btn" for="voiceInput">声を吹き込む</label>
  <input type="file" id="voiceInput" accept="audio/*" capture="microphone">

  <div>
    <audio id="audioPlayer" controls style="display:none;"></audio>
  </div>
  
  <p id="status">「声を吹き込む」を押してください</p>

  <script>
    const voiceInput = document.getElementById('voiceInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const status = document.getElementById('status');

    voiceInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        status.textContent = '録音データを取得しました。下のプレイヤーで再生できます。';
        const fileUrl = URL.createObjectURL(file);
        audioPlayer.src = fileUrl;
        audioPlayer.style.display = 'inline-block';
        audioPlayer.play();
      }
    });
  </script>
</body>
</html>
